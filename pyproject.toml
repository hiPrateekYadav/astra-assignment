[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.1.0"
description = "Teacher-student static vulnerability scanning for decompiled Android apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "httpx>=0.28",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
